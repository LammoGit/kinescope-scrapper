openapi: '3.2.0'
servers:
  - url: https://scrappy.ai
info:
  version: '1.0.0'
  title: 'Coordinator API'
  description: Manage jobs and workers for scraping Kinescope.
paths:
  # --- JOBS ---
  /api/jobs:
    get:
      operationId: GetJobs
      summary: Get a list of all jobs
      tags:
        - jobs
      security: []
      responses:
        '200':
          description: List of all jobs.
          content:
            application/json:
              schema:
                description: The list of jobs.
                type: array
                items:
                  $ref: '#/components/schemas/Job'
              examples:
                empty:
                  summary: No jobs yet
                  value: []
                someJobs:
                  summary: A couple of jobs
                  value:
                    - id: 100
                      name: Scrape batch #1
                      status: running
                      job:
                        range:
                          from: 1
                          to: 1000
                        request_timeout_seconds: 30
                        max_retries: 3
                        global_rate_limit_rps: 10
                        stop_on_consecutive_missing: 5
                      servers:
                        id: 1
                        name: worker-1
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error
    post:
      operationId: CreateJob
      summary: Creates a new job
      tags:
        - jobs
        - user_role_operator
      security:
        - BearerAuth: []
      requestBody:
        description: Configuration of the job to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreate'
            examples:
              basic:
                summary: Simple job creation
                value:
                  name: Scrape batch #2
                  job:
                    range:
                      from: 1
                      to: 1000
                    request_timeout_seconds: 30
                    max_retries: 3
                    global_rate_limit_rps: 10
                    stop_on_consecutive_missing: 5
      responses:
        '201':
          description: Created a new job.
          headers:
            Location:
              description: The URL of the newly created job.
              schema:
                type: string
                format: uri
              example: "https://scrappy.ai/api/jobs/100"
          content:
            application/json:
              schema:
                description: The newly created job.
                $ref: '#/components/schemas/Job'
              examples:
                created:
                  summary: The freshly created job
                  value:
                    id: 100
                    name: Scrape batch #2
                    status: created
                    job:
                      range:
                        from: 1
                        to: 1000
                      request_timeout_seconds: 30
                      max_retries: 3
                      global_rate_limit_rps: 10
                      stop_on_consecutive_missing: 5
        '400':
          description: Incorrect body syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badRequest:
                  summary: Malformed body
                  value:
                    error: "'name' is a required property"
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error

  /api/jobs/{jobId}:
    parameters:
      - name: jobId
        description: The unique identifier of the job.
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/JobId'
    get:
      operationId: GetJob
      summary: Get a job corresponding to the provided `jobId`
      tags:
        - jobs
      security: []
      responses:
        '200':
          description: Job corresponding to the provided `jobId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                job:
                  summary: A single job
                  value:
                    id: 100
                    name: Scrape batch
                    status: running
                    job:
                      range:
                        from: 1
                        to: 1000
                      request_timeout_seconds: 30
                      max_retries: 3
                      global_rate_limit_rps: 10
                      stop_on_consecutive_missing: 5
                    servers:
                      id: 1
                      name: worker-1
        '404':
          description: No job found for the provided `jobId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Job not found
                  value:
                    error: Job 100 not found
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error
    patch:
      operationId: EditJob
      summary: Edit a job corresponding to the provided `jobId`
      tags:
        - jobs
      security:
        - BearerAuth: []
      requestBody:
        description: Job configuration.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobUpdate'
            examples:
              rename:
                summary: Rename a job
                value:
                  name: Renamed batch
              changeRange:
                summary: Change job range
                value:
                  job:
                    range:
                      from: 1
                      to: 5000
      responses:
        '200':
          description: Job after successful update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                updated:
                  summary: Updated job
                  value:
                    id: 100
                    name: Renamed batch
                    status: running
                    job:
                      range:
                        from: 1
                        to: 5000
                      request_timeout_seconds: 30
                      max_retries: 3
                      global_rate_limit_rps: 10
                      stop_on_consecutive_missing: 5
        '404':
          description: No job found for the provided `jobId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Job not found
                  value:
                    error: Job 100 not found
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error
    delete:
      operationId: DeleteJob
      summary: Delete a job corresponding to the provided `jobId`
      tags:
        - jobs
        - user_role_operator
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Successfully deleted the job.
        '404':
          description: No job found for the provided `jobId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Job not found
                  value:
                    error: Job 100 not found
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error

  /api/jobs/{jobId}/start:
    parameters:
      - name: jobId
        description: The unique identifier of the job.
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/JobId'
