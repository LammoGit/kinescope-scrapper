                  n_requests: 800
                  n_found_materials: 700
                  n_active_downloads: 4
                  n_bytes_per_second: 900000
                  avg_check_speed: 0.4
                  avg_download_speed: 2.0
                  download_queue_size: 80
                  n_repeated_attempts: 8
                  n_final_errors: 1
                  oldest_in_queue: 100
      responses:
        '200':
          description: Metrics are successfully received and updated.
        '404':
          description: No worker found for the provided `workerId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
