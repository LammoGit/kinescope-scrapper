      responses:
        '200':
          description: Comment after successful update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
              examples:
                updated:
                  summary: Updated comment
                  value:
                    id: 1
                    video_id: 42
                    user_id: 1
                    text: Even better explanation!
                    created_at: 1700000000
                    updated_at: 1700000100
        '400':
          description: Incorrect body syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation:
                  summary: Validation error
                  value:
                    error: Comment text must not be empty
        '404':
          description: No comment found for the provided `comment_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Comment not found
                  value:
                    error: Comment 1 not found
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error
    delete:
      operationId: DeleteComment
      summary: Delete a comment
      tags:
        - service
      security:
        - BearerAuth: []
      parameters:
        - name: commentId
          in: query
          required: true
          description: Identifier of the comment to delete.
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '204':
          description: Comment successfully deleted.
        '404':
          description: No comment found for the provided `commentId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Comment not found
                  value:
                    error: Comment 1 not found
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error

components:
  schemas:
    # --- JOB SCHEMAS ---
    JobId:
      description: The unique identifier of a job.
      type: integer
      format: int64
      example: 100

    JobStatus:
      description: Status of a job.
      type: string
      enum:
        - created
        - validating
        - running
        - pausing
        - paused
        - stopping
        - stopped
        - completed
        - failed
      example: created

    JobConfig:
      description: Job's task configuration.
      type: object
      required:
        - range
        - request_timeout_seconds
        - max_retries
        - stop_on_consecutive_missing
      properties:
        range:
          description: Job's range of identifiers to process.
          type: object
          required:
            - from
            - to
          properties:
            from:
              description: Job's starting index.
              type: integer
              format: int64
              example: 1
            to:
              description: Job's ending index.
              type: integer
              format: int64
              example: 1000
        request_timeout_seconds:
          description: Number of seconds for worker to wait answer from Kinescope before closing connection.
          type: integer
          format: int32
          example: 30
        max_retries:
          description: Maximum number of retries due to rate limiting.
          type: integer
          format: int32
          example: 3
        global_rate_limit_rps:
          description: Maximum allowed worker's requests per second.
          type: integer
          format: int32
          example: 10
        stop_on_consecutive_missing:
          description: Stop processing after this many consecutive missing identifiers.
          type: integer
          format: int32
          example: 5
      example:
        range:
          from: 1
          to: 1000
        request_timeout_seconds: 30
        max_retries: 3
        global_rate_limit_rps: 10
        stop_on_consecutive_missing: 5

    Job:
      description: Job configuration.
      type: object
      required:
        - id
        - name
        - job
      properties:
        id:
          $ref: '#/components/schemas/JobId'
        name:
          description: Job's name.
          type: string
          example: Scrape batch #1
        status:
          $ref: '#/components/schemas/JobStatus'
        job:
          $ref: '#/components/schemas/JobConfig'
        servers:
          description: Worker's configuration attached to the job.
          $ref: '#/components/schemas/Worker'
      example:
        id: 100
        name: Scrape batch #1
        status: running
        job:
          range:
            from: 1
            to: 1000
          request_timeout_seconds: 30
          max_retries: 3
          global_rate_limit_rps: 10
          stop_on_consecutive_missing: 5
        servers:
          id: 1
          name: worker-1

    JobCreate:
      description: Payload to create a new job.
      type: object
      required:
        - name
        - job
      properties:
        name:
          description: Job's name.
          type: string
          example: Scrape batch #2
        job:
          $ref: '#/components/schemas/JobConfig'
      example:
        name: Scrape batch #2
        job:
          range:
            from: 1
            to: 1000
          request_timeout_seconds: 30
          max_retries: 3
          global_rate_limit_rps: 10
          stop_on_consecutive_missing: 5

    JobUpdate:
      description: Fields to update on a job.
      type: object
      properties:
        name:
          description: Job's name.
          type: string
          example: Renamed batch
        status:
          $ref: '#/components/schemas/JobStatus'
        job:
          $ref: '#/components/schemas/JobConfig'
        servers:
          description: Worker's configuration to attach to the job.
          $ref: '#/components/schemas/Worker'
      example:
        name: Renamed batch

    JobRange:
      description: Range block of a job that is given for processing to a worker.
      type: object
      required:
        - id
        - job_id
        - range_start
        - range_end
        - next_id
        - created_at
        - updated_at
      properties:
        id:
          description: Unique identifier of the range.
          type: integer
          format: int64
          example: 1
        job_id:
          description: Identifier of the job that the range belongs to.
          type: integer
          format: int64
          example: 100
        range_start:
          description: First identifier in the range.
          type: integer
          format: int64
          example: 1
        range_end:
          description: Last identifier in the range.
          type: integer
          format: int64
          example: 1000
        next_id:
          description: Next identifier that should be processed in the range.
          type: integer
          format: int64
          example: 1
        status:
          description: Status of the last identifier.
          $ref: '#/components/schemas/JobStatus'
        leased_by:
          description: >
            Identifier of the worker to which this range belongs.
            Doesn't belong to any worker if left empty.
          $ref: '#/components/schemas/WorkerId'
          default: null
        lease_expires_at:
          description: Unix timestamp (seconds) of when the lease should expire.
          type: integer
          format: int64
          example: 1700000060
        attempt:
          description: Current download attempt after rate limiting.
          type: integer
          format: int32
          default: 0
          example: 0
        created_at:
          description: Unix timestamp (seconds) of range creation.
          type: integer
          format: int64
          example: 1700000000
        updated_at:
          description: Unix timestamp (seconds) of last range update.
          type: integer
          format: int64
          example: 1700000300
      example:
        id: 1
        job_id: 100
        range_start: 1
        range_end: 1000
        next_id: 1
        status: running
        leased_by: 1
        lease_expires_at: 1700000060
        attempt: 0
        created_at: 1700000000
        updated_at: 1700000000

    JobEvent:
      description: Free-form job event message.
      type: string
      example: job started

    JobMetrics:
      description: Aggregated telemetry data from workers of some job.
      $ref: '#/components/schemas/WorkerMetrics'

    # --- WORKER SCHEMAS ---
    WorkerId:
      description: The unique identifier of a worker.
      type: integer
      format: int64
      example: 1

    Worker:
      description: General worker's info.
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/WorkerId'
        name:
          description: Worker's name.
          type: string
          example: worker-1
        host:
          description: Worker's host used for establishing an SSH connection.
          type: string
          example: 192.168.1.10
        ssh_port:
          description: Worker's port used for establishing an SSH connection.
          type: integer
          format: int32
          example: 22
        ssh_user:
          description: Worker's user used for establishing an SSH connection.
          type: string
          example: root
        ssh_key:
          description: Worker's private key used for establishing an SSH connection.
          type: string
          format: password
        threads:
          description: Number of threads used by a worker both for checking and download.
          type: integer
          format: int32
          example: 8
        storage_path:
          description: Path to the video/metadata storage.
          type: string
          example: /data/videos
        min_free_space_gb:
          description: Required minimum space in GB for the worker.
          type: integer
          format: int32
          example: 50
      example:
        id: 1
        name: worker-1
        host: 192.168.1.10
        ssh_port: 22
        ssh_user: root
        threads: 8
        storage_path: /data/videos
        min_free_space_gb: 50

    WorkerUpdate:
      description: Fields to update on a worker.
      type: object
      properties:
        name:
          description: Worker's name.
          type: string
          example: worker-renamed
        host:
          description: Worker's host used for establishing an SSH connection.
          type: string
          example: 192.168.1.11
        ssh_port:
          description: Worker's port used for establishing an SSH connection.
          type: integer
          format: int32
          example: 22
        ssh_user:
          description: Worker's user used for establishing an SSH connection.
          type: string
          example: root
        ssh_key:
          description: Worker's private key used for establishing an SSH connection.
          type: string
          format: password
        threads:
          description: Number of threads used by a worker both for checking and download.
          type: integer
          format: int32
          example: 16
        storage_path:
          description: Path to the video/metadata storage.
          type: string
          example: /data/videos
        min_free_space_gb:
          description: Required minimum space in GB for the worker.
          type: integer
          format: int32
          example: 100
      example:
        threads: 16
        min_free_space_gb: 100

    WorkerRegister:
      description: Request body sent by a user to register a worker.
      type: object
      required:
        - ssh_host
        - ssh_port
      properties:
        ssh_host:
          description: Host of a PC on which to install a worker.
          type: string
          example: 192.168.1.10
        ssh_port:
          description: SSH port of a PC on which to install a worker.
          type: integer
          format: int32
          example: 22
      example:
        ssh_host: 192.168.1.10
        ssh_port: 22

    WorkerMetrics:
      description: Worker telemetry snapshot.
      type: object
      required:
        - cpu_load
        - memory_load
        - disk_load
        - network_load
        - free_space_bytes
        - n_opened_files
        - n_active_connections
        - worker_uptime
        - identifiers_per_second
        - n_requests
        - n_found_materials
        - n_active_downloads
        - n_bytes_per_second
        - avg_check_speed
        - avg_download_speed
        - download_queue_size
        - n_repeated_attempts
        - n_final_errors
        - oldest_in_queue
      properties:
        cpu_load:
          description: CPU load in percent.
          type: number
          format: double
          example: 45.2
        memory_load:
          description: RAM and SWAP load in percent.
          type: number
          format: double
          example: 60.5
        disk_load:
          description: Disk IO load in percent.
          type: number
          format: double
          example: 30.0
        network_load:
          description: Network load in percent.
          type: number
          format: double
          example: 20.5
        free_space_bytes:
          description: Free space left in bytes.
          type: integer
          format: int64
          example: 1073741824
        n_opened_files:
          description: Number of currently opened files.
          type: integer
          format: int64
          example: 100
        n_active_connections:
          description: Number of currently active connections.
          type: integer
          format: int64
          example: 10
        worker_uptime:
          description: Uptime of the worker in seconds.
          type: integer
          format: int64
          example: 3600
        identifiers_per_second:
          description: Number of identifiers being processed per second.
          type: number
          format: double
          example: 5.5
        n_requests:
          description: Number of requests sent.
          type: integer
          format: int64
          example: 1000
        n_found_materials:
          description: Number of found materials.
          type: integer
          format: int64
          example: 800
        n_active_downloads:
          description: Number of active downloads.
          type: integer
          format: int64
          example: 5
        n_bytes_per_second:
          description: Number of bytes being downloaded per second.
          type: number
          format: double
          example: 1048576
        avg_check_speed:
          description: Average speed of checking an identifier (seconds).
          type: number
          format: double
          example: 0.5
        avg_download_speed:
          description: Average download speed (MB/s).
          type: number
          format: double
          example: 2.5
        download_queue_size:
          description: Size of the download queue.
          type: integer
          format: int64
          example: 100
        n_repeated_attempts:
          description: Number of repeated attempts after rate limiting.
          type: integer
          format: int64
          example: 10
        n_final_errors:
          description: Number of final errors.
          type: integer
          format: int64
          example: 2
        oldest_in_queue:
          description: Age (seconds) of the oldest task in the download queue.
          type: integer
          format: int64
          example: 120
      example:
        cpu_load: 45.2
        memory_load: 60.5
        disk_load: 30.0
        network_load: 20.5
        free_space_bytes: 1073741824
        n_opened_files: 100
        n_active_connections: 10
        worker_uptime: 3600
        identifiers_per_second: 5.5
        n_requests: 1000
        n_found_materials: 800
        n_active_downloads: 5
        n_bytes_per_second: 1048576
        avg_check_speed: 0.5
        avg_download_speed: 2.5
        download_queue_size: 100
        n_repeated_attempts: 10
        n_final_errors: 2
        oldest_in_queue: 120

    # --- USER SCHEMAS ---
    UserId:
      description: The unique identifier of a user.
      type: integer
      format: int64
      example: 1

    UserRole:
      description: Role assigned to a user.
      type: string
      enum:
        - viewer
        - operator
        - administrator
      example: viewer

    User:
      description: General user info.
      type: object
      required:
        - id
        - username
        - role
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        username:
          description: Unique login name of the user.
          type: string
          example: johndoe
        email:
          description: Email address of the user.
          type: string
          format: email
          example: johndoe@example.com
        avatar:
          description: Avatar of the user, base64-encoded.
          type: string
          format: byte
        role:
          $ref: '#/components/schemas/UserRole'
        created_at:
          description: Unix timestamp (seconds) of user creation.
          type: integer
          format: int64
          example: 1700000000
        updated_at:
          description: Unix timestamp (seconds) of the last user update.
          type: integer
          format: int64
          example: 1700000100
      example:
        id: 1
        username: johndoe
        email: johndoe@example.com
        role: viewer
        created_at: 1700000000
        updated_at: 1700000000

    UserRegister:
      description: Registration form fields.
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          description: Desired login name.
          type: string
          minLength: 3
          maxLength: 64
          example: johndoe
        email:
          description: Email address.
          type: string
          format: email
          example: johndoe@example.com
        password:
          description: Account password.
          type: string
          format: password
          minLength: 8
          maxLength: 64
          example: hunter2hunter2
      example:
        username: johndoe
        email: johndoe@example.com
        password: hunter2hunter2

    UserLogin:
      description: Login form fields.
      type: object
      required:
        - email
        - password
      properties:
        email:
          description: Registered email address.
          type: string
          format: email
          example: johndoe@example.com
        password:
          description: Account password.
          type: string
          format: password
          example: hunter2hunter2
      example:
        email: johndoe@example.com
        password: hunter2hunter2

    TokenPair:
      description: Access and refresh token pair issued after login/refresh.
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
      properties:
        access_token:
          description: Short-lived JWT access token.
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.abc
        refresh_token:
          description: Long-lived JWT refresh token.
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwidHlwIjoicmVmcmVzaCJ9.def
        token_type:
          description: Token type, always "Bearer".
          type: string
          const: "Bearer"
      example:
        access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.abc
        refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwidHlwIjoicmVmcmVzaCJ9.def
        token_type: Bearer

    RefreshTokenRequest:
      description: Refresh request payload.
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          description: The refresh token previously issued to the client.
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwidHlwIjoicmVmcmVzaCJ9.def
      example:
        refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwidHlwIjoicmVmcmVzaCJ9.def

    UserUpdate:
      description: Fields to update on a user.
      type: object
      properties:
        username:
          description: New login name.
          type: string
          minLength: 3
          maxLength: 64
          example: john_doe
        email:
          description: New email address.
          type: string
          format: email
          example: john_doe@example.com
        avatar:
          description: New avatar, base64-encoded.
          type: string
          format: byte
        password:
          description: New password.
          type: string
          format: password
          minLength: 8
          example: newpassword123
        role:
          $ref: '#/components/schemas/UserRole'
      example:
        username: john_doe

    # --- WEB SERVICE SCHEMAS ---
    VideoId:
      description: The unique identifier of a video.
      type: integer
      format: int64
      example: 42

    Video:
      description: Video metadata.
      type: object
      required:
        - id
        - title
      properties:
        id:
          $ref: '#/components/schemas/VideoId'
        title:
          description: Video title.
          type: string
          example: Python tutorial part 1
        description:
          description: Video description.
          type: string
          example: Getting started with Python
        duration_seconds:
          description: Video duration in seconds.
          type: integer
          format: int64
          example: 120
        thumbnail:
          description: Video thumbnail, base64-encoded.
          type: string
          format: byte
        video_url:
          description: URL of the video file.
          type: string
          format: uri
          example: https://example.com/videos/42.mp4
        average_score:
          description: Average score given by users.
          type: number
          format: double
          example: 8.5
        reactions_count:
          description: Number of reactions recorded.
          type: integer
          format: int64
          example: 100
        comments_count:
          description: Number of comments on the video.
          type: integer
          format: int64
          example: 5
        created_at:
          description: Unix timestamp (seconds) of video creation.
          type: integer
          format: int64
          example: 1700000000
      example:
        id: 42
        title: Python tutorial part 1
        description: Getting started with Python
        duration_seconds: 120
        video_url: https://example.com/videos/42.mp4
        average_score: 8.5
        reactions_count: 100
        comments_count: 5
        created_at: 1700000000

    VideoList:
      description: Paginated list of videos.
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Video'
        total:
          description: Total number of matching videos.
          type: integer
          format: int64
          example: 1
        limit:
          description: Maximum number of items returned.
          type: integer
          format: int32
          example: 20
        offset:
          description: Number of items skipped.
          type: integer
          format: int32
          example: 0
      example:
        items:
          - id: 42
            title: Python tutorial part 1
            duration_seconds: 120
            video_url: https://example.com/videos/42.mp4
            average_score: 8.5
            reactions_count: 100
            comments_count: 5
            created_at: 1700000000
        total: 1
        limit: 20
        offset: 0

    VideoScore:
      description: Score a video.
      type: object
      required:
        - score
      properties:
        score:
          description: User's score for the video.
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          example: 9
      example:
        score: 9

    Comment:
      description: A comment left on a video.
      type: object
      required:
        - id
        - video_id
        - user_id
        - text
      properties:
        id:
          description: Comment identifier.
          type: integer
          format: int64
          example: 1
        video_id:
          $ref: '#/components/schemas/VideoId'
        user_id:
          $ref: '#/components/schemas/UserId'
        text:
          description: Comment text.
          type: string
          example: Great video!
        created_at:
          description: Unix timestamp (seconds) of comment creation.
          type: integer
          format: int64
          example: 1700000000
        updated_at:
          description: Unix timestamp (seconds) of last comment update.
          type: integer
          format: int64
          example: 1700000000
      example:
        id: 1
        video_id: 42
        user_id: 1
        text: Great video!
        created_at: 1700000000
        updated_at: 1700000000

    CommentList:
      description: Paginated list of comments.
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        total:
          description: Total number of comments.
          type: integer
          format: int64
          example: 1
        limit:
          description: Maximum number of items returned.
          type: integer
          format: int32
          example: 50
        offset:
          description: Number of items skipped.
          type: integer
          format: int32
          example: 0
      example:
        items:
          - id: 1
            video_id: 42
            user_id: 1
            text: Great video!
            created_at: 1700000000
            updated_at: 1700000000
        total: 1
        limit: 50
        offset: 0

    CommentCreate:
      description: Body to create a new comment.
      type: object
      required:
        - video_id
        - text
      properties:
        video_id:
          $ref: '#/components/schemas/VideoId'
        text:
          description: Comment text.
          type: string
          minLength: 1
          maxLength: 2000
          example: Nice explanation!
      example:
        video_id: 42
        text: Nice explanation!

    CommentUpdate:
      description: Body to update an existing comment.
      type: object
      required:
        - comment_id
        - text
      properties:
        comment_id:
          description: Comment identifier.
          type: integer
          format: int64
          example: 1
        text:
          description: New comment text.
          type: string
          minLength: 1
          maxLength: 2000
          example: Even better explanation!
      example:
        comment_id: 1
        text: Even better explanation!

    # --- OTHER SCHEMAS ---
    Error:
      description: Definition for the general error class.
      type: object
      required:
        - error
      properties:
        error:
          description: A human readable error message.
          type: string
          example: Internal server error
      example:
        error: Internal server error

    SubscribeFilter:
      description: Filter used to subscribe to certain identifiers.
      type: array
      items:
        oneOf:
          - type: integer
            description: A single ID.
            format: int64
          - type: string
            pattern: '^\d+-\d+$'
            description: A range of IDs.
      example: ["100-101", 200, 103]

  securitySchemes:
    # JWT token
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Pass your client/user JWT here.

    # The HTTP Signature headers from RFC 9421
    HttpMessageSignature:
      type: apiKey
      in: header
      name: Signature
      description: >
        Requires RFC 9421 HTTP message signatures. 
        Must be together with 'Signature-Input' and 'Signature-Key' headers.
