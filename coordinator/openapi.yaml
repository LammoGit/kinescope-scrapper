        in: path
        required: true
        schema:
          $ref: '#/components/schemas/JobId'
    get:
      operationId: GetItems
      summary: Get a list of identifiers of downloaded videos for the job
      tags:
        - jobs
      security: []
      responses:
        '200':
          description: The list of identifiers of videos downloaded for the job.
          content:
            application/json:
              schema:
                description: The list of identifiers.
                type: array
                items:
                  description: A video identifier.
                  type: integer
                  format: int64
              examples:
                someItems:
                  summary: Some downloaded video identifiers
                  value: [42, 43, 44, 100]
        '404':
          description: No job found for the provided `jobId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Job not found
                  value:
                    error: Job 100 not found
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error

  /api/jobs/{jobId}/events:
