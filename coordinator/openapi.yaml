  /api/stream/events:
    get:
      operationId: SSEEvents
      summary: An SSE stream of coordinator and worker events
      tags:
        - sse
      security:
        - BearerAuth: []
      parameters:
        - name: token
          in: query
          required: false
          description: >
            JWT access token. Browsers cannot set the Authorization header on
            an EventSource, so the token may be passed as a query parameter.
          schema:
            type: string
        - name: jobs
          in: query
          required: false
          style: form
          explode: true
          description: Job IDs to listen for.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/JobId'
          example: [100]
        - name: workers
          in: query
          required: false
          style: form
          explode: true
          description: Worker IDs to listen for.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/WorkerId'
          example: [1]
      responses:
        '200':
          description: Events stream via SSE.
          content:
            text/event-stream:
              itemSchema:
                oneOf:
                  - description: The initial event snapshot of the subscribed topics.
                    type: object
                    properties:
                      event:
                        type: string
                        const: "event"
                      data:
                        description: Every stored event of the subscribed topics.
                        type: array
                        items:
                          $ref: '#/components/schemas/Event'
                  - description: A newly recorded event.
                    type: object
                    properties:
                      event:
                        type: string
                        const: "event"
                      data:
                        $ref: '#/components/schemas/Event'
                  - description: Just a comment used as a keep-alive message.
                    type: string
                    const: ":"
              examples:
                snapshot:
                  summary: The initial event snapshot
                  value:
                    event: event
                    data:
                      - time: 1700000000
                        level: Info
                        component: Job service
                        job_id: 100
                        worker_id: 0
                        range_id: 0
                        resource_id: 0
                        operation_type: create
                        result: success
                        error_code: 200
                        message: job is created successfully
                event:
                  summary: A newly recorded event
                  value:
                    event: event
                    data:
                      time: 1700000100
                      level: Info
                      component: Job service
                      job_id: 100
                      worker_id: 0
                      range_id: 0
                      resource_id: 0
                      operation_type: start
                      result: success
                      error_code: 200
                      message: job is started successfully
                keepAlive:
                  summary: Keep-alive comment
                  value: ":"
        '401':
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  summary: Token is expired
                  value:
                    errors:
                      - received token is expired
                    status: fail
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    errors:
                      - Internal server error
                    status: fail

