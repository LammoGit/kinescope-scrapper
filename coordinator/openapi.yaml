      - name: jobId
        description: The unique identifier of the job.
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/JobId'
    get:
      operationId: GetEvents
      summary: Get a list of events for a job
      tags:
        - jobs
      security: []
      responses:
        '200':
          description: The list of events for a job.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobEvent'
              examples:
                events:
                  summary: Some job events
                  value:
                    - job created
                    - job started
                    - job paused
        '404':
          description: No job found for the provided `jobId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Job not found
                  value:
                    error: Job 100 not found
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error

  # --- WORKERS ---
  /api/workers/register:
    post:
      operationId: RegisterWorker
      summary: Register a new worker
      tags:
        - workers
        - user_role_operator
      security:
        - BearerAuth: []
      requestBody:
        description: Info needed to register the worker.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerRegister'
            examples:
              register:
                summary: Register a new worker
                value:
                  ssh_host: 192.168.1.10
                  ssh_port: 22
      responses:
        '201':
          description: Worker is successfully registered.
          headers:
            Location:
              description: The URL of the newly created worker.
              schema:
                type: string
                format: uri
              example: "https://scrappy.ai/api/workers/1"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worker'
              examples:
                created:
                  summary: The freshly registered worker
                  value:
                    id: 1
                    name: worker-1
                    host: 192.168.1.10
                    ssh_port: 22
                    ssh_user: root
                    threads: 8
                    storage_path: /data/videos
                    min_free_space_gb: 50
        '404':
          description: No worker found for the provided `workerId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Worker not found
                  value:
                    error: Worker 1 not found
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error

  /api/workers/{workerId}/heartbeat:
    parameters:
      - name: workerId
        description: The unique identifier of the worker.
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/WorkerId'
    post:
      operationId: SendHeartbeat
      summary: Send a heartbeat message to prolong worker-coordinator connection
      tags:
        - workers
        - user_role_operator
      security:
        - HttpMessageSignature: []
      requestBody:
        description: Optional current metrics of the worker.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerMetrics'
            examples:
              minimal:
                summary: Heartbeat with metrics
                value:
                  cpu_load: 45.2
                  memory_load: 60.5
                  disk_load: 30.0
                  network_load: 20.5
                  free_space_bytes: 1073741824
                  n_opened_files: 100
                  n_active_connections: 10
                  worker_uptime: 3600
                  identifiers_per_second: 5.5
                  n_requests: 1000
                  n_found_materials: 800
                  n_active_downloads: 5
                  n_bytes_per_second: 1048576
                  avg_check_speed: 0.5
                  avg_download_speed: 2.5
                  download_queue_size: 100
                  n_repeated_attempts: 10
                  n_final_errors: 2
                  oldest_in_queue: 120
      responses:
        '200':
          description: Metrics of the worker corresponding to the provided `workerId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerMetrics'
              examples:
                metrics:
                  summary: Current metrics
                  value:
                    cpu_load: 45.2
                    memory_load: 60.5
                    disk_load: 30.0
                    network_load: 20.5
                    free_space_bytes: 1073741824
                    n_opened_files: 100
                    n_active_connections: 10
                    worker_uptime: 3600
                    identifiers_per_second: 5.5
                    n_requests: 1000
                    n_found_materials: 800
                    n_active_downloads: 5
                    n_bytes_per_second: 1048576
                    avg_check_speed: 0.5
                    avg_download_speed: 2.5
                    download_queue_size: 100
                    n_repeated_attempts: 10
                    n_final_errors: 2
                    oldest_in_queue: 120
        '404':
          description: No worker found for the provided `workerId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Worker not found
                  value:
                    error: Worker 1 not found
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error

  /api/workers/{workerId}/lease:
    parameters:
      - name: workerId
        description: The unique identifier of the worker requesting a job lease.
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/WorkerId'
    post:
      operationId: LeaseJobRange
      summary: Lease an available job from the queue
      description: >
        Workers call this endpoint to declare themselves idle and available for work. 
        If a job is ready in the coordinator's queue, it is returned immediately. 
        If no jobs are available, the coordinator holds this connection open until a job 
        is submitted or the internal timeout is reached.
      tags:
        - workers
        - signed
      security:
        - HttpMessageSignature: []
      parameters:
        - name: timeout
          in: query
          required: false
          description: >
            Optional maximum time (in seconds) the coordinator should hold the connection open 
            before timing out.
          schema:
            type: integer
            format: int32
            default: 30
            maximum: 45
          example: 30
      requestBody:
        description: Optional current metrics or state of the worker to assist with job scheduling.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerMetrics'
            examples:
              idle:
                summary: Worker reporting idle state
                value:
                  cpu_load: 5.0
                  memory_load: 20.0
                  disk_load: 5.0
                  network_load: 1.0
                  free_space_bytes: 10737418240
                  n_opened_files: 5
                  n_active_connections: 0
                  worker_uptime: 7200
                  identifiers_per_second: 0.0
                  n_requests: 0
                  n_found_materials: 0
                  n_active_downloads: 0
                  n_bytes_per_second: 0.0
                  avg_check_speed: 0.0
                  avg_download_speed: 0.0
                  download_queue_size: 0
                  n_repeated_attempts: 0
                  n_final_errors: 0
                  oldest_in_queue: 0
      responses:
        '200':
          description: A job was successfully leased to the worker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRange'
              examples:
                leased:
                  summary: A leased job range
                  value:
                    id: 1
                    job_id: 100
                    range_start: 1
                    range_end: 1000
                    next_id: 1
                    status: running
                    leased_by: 1
                    lease_expires_at: 1700000060
                    attempt: 0
                    created_at: 1700000000
                    updated_at: 1700000000
        '204':
          description: >
            Timeout reached. No jobs became available during the long-poll window. 
            The worker should immediately issue a new lease request.
        '404':
          description: No worker found for the provided `workerId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Worker not found
                  value:
                    error: Worker 1 not found
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error

