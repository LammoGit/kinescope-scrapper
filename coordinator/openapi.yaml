                        updated_at: 1700000000
                    total: 1
                    limit: 50
                    offset: 0
        '400':
          description: Missing or invalid `videoId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  summary: Missing `videoId`
                  value:
                    error: Query parameter 'videoId' is required
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
