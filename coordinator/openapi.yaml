              examples:
                notFound:
                  summary: Job not found
                  value:
                    error: Job 100 not found
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
