                        avg_check_speed: 0.5
                        avg_download_speed: 2.5
                        download_queue_size: 100
                        repeated_attempts: 10
                        final_errors: 2
                        oldest_in_queue: 120
                keepAlive:
                  summary: Keep-alive comment
                  value: ":"
        '401':
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  summary: Token is expired
