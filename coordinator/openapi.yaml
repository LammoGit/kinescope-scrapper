  # --- Users ---
  /api/user/register:
    post:
      operationId: RegisterUser
      summary: Register a new user via HTML form
      description: >
        Accepts the registration form using `application/x-www-form-urlencoded`
        encoding, matching the default `enctype` of an HTML `<form>` element.
      tags:
        - users
      security: []
      requestBody:
        description: Registration form fields.
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegister'
            encoding:
              username:
                style: form
                explode: true
              email:
                style: form
                explode: true
              password:
                style: form
                explode: true
            examples:
              register:
                summary: Example registration form
                value:
                  username: johndoe
                  email: johndoe@example.com
                  password: hunter2hunter2
      responses:
        '201':
          description: User successfully registered.
          headers:
            Location:
              description: The URL of the newly created user.
              schema:
                type: string
                format: uri
              example: "https://scrappy.ai/api/user/1"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                created:
                  summary: The freshly registered user
                  value:
                    id: 1
                    username: johndoe
                    email: johndoe@example.com
                    role: viewer
                    created_at: 1700000000
                    updated_at: 1700000000
        '400':
          description: Incorrect form data or username/email already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                usernameTaken:
                  summary: Username already taken
                  value:
                    error: Username 'johndoe' is already taken
                validation:
                  summary: Validation error
                  value:
                    error: Password must be at least 8 characters long
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error

