      responses:
        '200':
          description: Job is successfully resumed.
        '404':
          description: No job found for the provided `jobId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Job not found
                  value:
                    error: Job 100 not found
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
