  /api/user/refresh:
    post:
      operationId: RefreshToken
      summary: Exchange a refresh token for a new token pair
      description: >
        Rotates the refresh token: the old refresh token is invalidated and a
        fresh access/refresh pair is issued. Typically called from JavaScript,
        so the body is JSON rather than a form.
      tags:
        - users
      security: []
      requestBody:
        description: Refresh token to exchange for a new token pair.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            examples:
              refresh:
                summary: Example refresh request
                value:
                  refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwidHlwIjoicmVmcmVzaCJ9.def
      responses:
        '200':
          description: New access/refresh token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              examples:
                tokens:
                  summary: Rotated token pair
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.ghi
                    refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwidHlwIjoicmVmcmVzaCJ9.jkl
                    token_type: Bearer
        '401':
          description: Invalid, expired, or revoked refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  summary: Refresh token invalid
                  value:
                    error: Refresh token is invalid or has expired
