          description: Successfully logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              examples:
                tokens:
                  summary: Issued token pair
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.abc
                    refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwidHlwIjoicmVmcmVzaCJ9.def
