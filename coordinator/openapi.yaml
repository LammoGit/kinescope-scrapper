                  disk_load: 12.0
                  network_load: 3.0
                  free_space_bytes: 1900000000
                  n_opened_files: 15
                  n_active_connections: 2
                  worker_uptime: 5100
                  identifiers_per_second: 0.0
                  n_requests: 0
                  n_found_materials: 0
                  n_active_downloads: 0
                  n_bytes_per_second: 0.0
                  avg_check_speed: 0.0
                  avg_download_speed: 0.0
                  download_queue_size: 0
                  n_repeated_attempts: 0
                  n_final_errors: 1
                  oldest_in_queue: 0
      responses:
        '200':
          description: >
            Worker is successfully marked as failed.
            Metrics are successfully received and updated if sent.
        '404':
          description: No worker found for the provided `workerId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Worker not found
                  value:
                    error: Worker 1 not found
        '500':
          description: Unexpected error.
          content:
