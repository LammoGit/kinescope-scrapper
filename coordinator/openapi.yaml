            application/json:
              schema:
                $ref: '#/components/schemas/VideoList'
              examples:
                results:
                  summary: Recommendations for video 42
                  value:
                    items:
                      - $ref: '#/components/schemas/Video'
                    quantity: 1
        '400':
          description: Incorrect path or query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingLimit:
                  summary: Missing `limit`
                  value:
                    errors:
                      - "limit: limit is required"
                    status: fail
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error

  /api/service/video/{videoId}/score:
    parameters:
      - name: videoId
        description: The unique identifier of the video being scored.
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/VideoId'
    post:
      operationId: RankVideo
      summary: Submit a reaction/score for a video
      tags:
        - service
      security:
        - BearerAuth: []
      requestBody:
        description: Score to apply to the target video.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoScore'
            examples:
              score:
                summary: Score a video
                value:
                  score: 9
      responses:
        '204':
          description: Score successfully recorded.
        '400':
          description: Incorrect body syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation:
                  summary: Validation error
                  value:
                    error: Score must be between 1 and 10
        '404':
          description: No video found for the provided `videoId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Video not found
                  value:
                    error: Video 42 not found
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error

  /api/service/video/comments:
    get:
      operationId: GetComments
      summary: Get comments for a video
      tags:
        - service
      security: []
      parameters:
        - name: videoId
          in: query
          required: true
          description: Identifier of the video.
          schema:
            $ref: '#/components/schemas/VideoId'
          example: 42
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 50
            maximum: 200
          example: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
          example: 0
      responses:
        '200':
          description: List of comments for the video.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentList'
              examples:
                results:
                  summary: A page of comments
                  value:
                    items:
                      - id: 1
                        video_id: 42
                        user_id: 1
                        text: Great video!
                        created_at: 1700000000
                        updated_at: 1700000000
                    total: 1
                    limit: 50
                    offset: 0
        '400':
          description: Missing or invalid `videoId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  summary: Missing `videoId`
                  value:
                    error: Query parameter 'videoId' is required
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error
    post:
      operationId: CreateComment
      summary: Add a new comment to a video
      tags:
        - service
      security:
        - BearerAuth: []
      requestBody:
        description: Comment to be created.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreate'
            examples:
              create:
                summary: Create a comment
                value:
                  video_id: 42
                  text: Nice explanation!
      responses:
        '201':
          description: Comment successfully created.
          headers:
            Location:
              description: The URL of the newly created comment.
              schema:
                type: string
                format: uri
              example: "https://scrappy.ai/api/service/video/comments/1"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
              examples:
                created:
                  summary: The freshly created comment
                  value:
                    id: 1
                    video_id: 42
                    user_id: 1
                    text: Nice explanation!
                    created_at: 1700000000
                    updated_at: 1700000000
        '400':
          description: Incorrect body syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation:
                  summary: Validation error
                  value:
                    error: Comment text must not be empty
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error
    put:
      operationId: UpdateComment
      summary: Update an existing comment
      tags:
        - service
      security:
        - BearerAuth: []
      requestBody:
        description: Updated comment payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentUpdate'
            examples:
              update:
                summary: Update a comment
                value:
                  comment_id: 1
                  text: Even better explanation!
      responses:
        '200':
          description: Comment after successful update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
              examples:
                updated:
                  summary: Updated comment
                  value:
                    id: 1
                    video_id: 42
                    user_id: 1
                    text: Even better explanation!
                    created_at: 1700000000
                    updated_at: 1700000100
        '400':
          description: Incorrect body syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation:
                  summary: Validation error
                  value:
                    error: Comment text must not be empty
        '404':
          description: No comment found for the provided `comment_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Comment not found
                  value:
                    error: Comment 1 not found
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error
    delete:
      operationId: DeleteComment
      summary: Delete a comment
      tags:
        - service
      security:
        - BearerAuth: []
      parameters:
        - name: commentId
          in: query
          required: true
          description: Identifier of the comment to delete.
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '204':
          description: Comment successfully deleted.
        '404':
          description: No comment found for the provided `commentId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Comment not found
                  value:
                    error: Comment 1 not found
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error

components:
  schemas:
    # --- JOB SCHEMAS ---
    JobId:
      description: The unique identifier of a job.
      type: integer
      format: int64
      example: 100

    JobStatus:
      description: Status of a job.
      type: string
      enum:
        - created
        - validating
        - running
        - pausing
        - paused
        - stopping
        - stopped
        - completed
        - failed
      example: created

    JobConfig:
      description: Job's task configuration.
      type: object
      required:
        - range
        - request_timeout_seconds
        - max_retries
        - stop_on_consecutive_missing
      properties:
        range:
          description: Job's range of identifiers to process.
          type: object
          required:
            - from
            - to
          properties:
            from:
              description: Job's starting index.
              type: integer
              format: int64
              example: 1
            to:
              description: Job's ending index.
              type: integer
              format: int64
              example: 1000
        request_timeout_seconds:
          description: Number of seconds for worker to wait answer from Kinescope before closing connection.
          type: integer
          format: int32
          example: 30
        max_retries:
          description: Maximum number of retries due to rate limiting.
          type: integer
          format: int32
          example: 3
        global_rate_limit_rps:
          description: Maximum allowed worker's requests per second.
          type: integer
          format: int32
          example: 10
        stop_on_consecutive_missing:
          description: Stop processing after this many consecutive missing identifiers.
          type: integer
          format: int32
          example: 5
      example:
        range:
          from: 1
          to: 1000
        request_timeout_seconds: 30
        max_retries: 3
        global_rate_limit_rps: 10
        stop_on_consecutive_missing: 5

    Job:
      description: Job configuration.
      type: object
      required:
        - id
        - name
        - job
      properties:
        id:
          $ref: '#/components/schemas/JobId'
        name:
          description: Job's name.
          type: string
          example: Scrape batch #1
        status:
          $ref: '#/components/schemas/JobStatus'
        job:
          $ref: '#/components/schemas/JobConfig'
        servers:
          description: Worker's configuration attached to the job.
          $ref: '#/components/schemas/Worker'
      example:
        id: 100
        name: Scrape batch #1
        status: running
        job:
          range:
            from: 1
            to: 1000
          request_timeout_seconds: 30
          max_retries: 3
          global_rate_limit_rps: 10
          stop_on_consecutive_missing: 5
        servers:
          id: 1
          name: worker-1

    JobCreate:
      description: Payload to create a new job.
      type: object
      required:
        - name
        - job
      properties:
        name:
          description: Job's name.
          type: string
          example: Scrape batch #2
        job:
          $ref: '#/components/schemas/JobConfig'
      example:
        name: Scrape batch #2
        job:
          range:
            from: 1
            to: 1000
          request_timeout_seconds: 30
          max_retries: 3
          global_rate_limit_rps: 10
          stop_on_consecutive_missing: 5

    JobUpdate:
      description: Fields to update on a job.
      type: object
      properties:
        name:
          description: Job's name.
          type: string
          example: Renamed batch
        status:
          $ref: '#/components/schemas/JobStatus'
        job:
          $ref: '#/components/schemas/JobConfig'
        servers:
          description: Worker's configuration to attach to the job.
          $ref: '#/components/schemas/Worker'
      example:
        name: Renamed batch

    JobRange:
      description: Range block of a job that is given for processing to a worker.
      type: object
      required:
        - id
        - job_id
        - range_start
        - range_end
        - next_id
        - created_at
        - updated_at
      properties:
        id:
          description: Unique identifier of the range.
          type: integer
          format: int64
          example: 1
        job_id:
          description: Identifier of the job that the range belongs to.
          type: integer
          format: int64
          example: 100
        range_start:
          description: First identifier in the range.
          type: integer
          format: int64
          example: 1
        range_end:
          description: Last identifier in the range.
          type: integer
          format: int64
          example: 1000
        next_id:
          description: Next identifier that should be processed in the range.
          type: integer
          format: int64
          example: 1
        status:
          description: Status of the last identifier.
          $ref: '#/components/schemas/JobStatus'
        leased_by:
          description: >
            Identifier of the worker to which this range belongs.
            Doesn't belong to any worker if left empty.
          $ref: '#/components/schemas/WorkerId'
          default: null
        lease_expires_at:
          description: Unix timestamp (seconds) of when the lease should expire.
          type: integer
          format: int64
          example: 1700000060
        attempt:
          description: Current download attempt after rate limiting.
          type: integer
          format: int32
          default: 0
          example: 0
        created_at:
          description: Unix timestamp (seconds) of range creation.
          type: integer
          format: int64
          example: 1700000000
        updated_at:
          description: Unix timestamp (seconds) of last range update.
          type: integer
          format: int64
          example: 1700000300
      example:
        id: 1
        job_id: 100
        range_start: 1
        range_end: 1000
        next_id: 1
        status: running
        leased_by: 1
        lease_expires_at: 1700000060
        attempt: 0
        created_at: 1700000000
        updated_at: 1700000000

    JobEvent:
      description: Free-form job event message.
      type: string
      example: job started

    Event:
      description: A single log entry emitted by the coordinator or a worker.
      type: object
      required:
        - time
        - level
        - component
        - resource_id
        - operation_type
        - result
        - error_code
        - message
      properties:
        time:
          description: Time the event happened at.
          type: string
          format: date-time
        level:
          description: Severity of the event.
          type: string
          enum:
            - Error
            - Warning
            - Info
            - Debug
          example: Info
        component:
          description: Component that emitted the event.
          type: string
          example: Job service
        job_id:
          description: Identifier of the job the event belongs to, 0 when it doesn't belong to any job.
          type: integer
          format: int64
          example: 100
        worker_id:
          description: Identifier of the worker the event belongs to, 0 when it doesn't belong to any worker.
          type: integer
          format: int64
          example: 0
        range_id:
          description: Identifier of the range the event belongs to, 0 when it doesn't belong to any range.
          type: integer
          format: int64
          example: 0
        resource_id:
          description: Identifier of the resource the event belongs to.
          type: integer
          format: int64
          example: 0
        operation_type:
          description: Operation the event was recorded for.
          type: string
          example: create
        result:
          description: Result of the operation, "success" or "fail".
          type: string
          example: success
        error_code:
          description: HTTP status code of the operation, 200 on success.
          type: integer
          format: int32
          example: 200
        message:
          description: Human readable event message.
          type: string
          example: job is created successfully
      example:
        time: 1700000000
        level: Info
        component: Job service
        job_id: 100
        worker_id: 0
        range_id: 0
        resource_id: 0
        operation_type: create
        result: success
        error_code: 200
        message: job is created successfully

    JobMetrics:
      description: Aggregated telemetry data from workers of some job.
      $ref: '#/components/schemas/WorkerMetrics'

    # --- WORKER SCHEMAS ---
    WorkerId:
      description: The unique identifier of a worker.
      type: integer
      format: int64
      example: 1

    Worker:
      description: General worker's info.
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/WorkerId'
        name:
          description: Worker's name.
          type: string
          example: worker-1
        host:
          description: Worker's host used for establishing an SSH connection.
          type: string
          example: 192.168.1.10
        ssh_port:
          description: Worker's port used for establishing an SSH connection.
          type: integer
          format: int32
          example: 22
        ssh_user:
          description: Worker's user used for establishing an SSH connection.
          type: string
          example: root
        ssh_key:
          description: Worker's private key used for establishing an SSH connection.
          type: string
          format: password
        threads:
          description: Number of threads used by a worker both for checking and download.
          type: integer
          format: int32
          example: 8
        storage_path:
          description: Path to the video/metadata storage.
          type: string
          example: /data/videos
        min_free_space_gb:
          description: Required minimum space in GB for the worker.
          type: integer
          format: int32
          example: 50
      example:
        id: 1
        name: worker-1
        host: 192.168.1.10
        ssh_port: 22
        ssh_user: root
        threads: 8
        storage_path: /data/videos
        min_free_space_gb: 50

    WorkerUpdate:
      description: Fields to update on a worker.
      type: object
      properties:
        name:
          description: Worker's name.
          type: string
          example: worker-renamed
        host:
          description: Worker's host used for establishing an SSH connection.
          type: string
          example: 192.168.1.11
        ssh_port:
          description: Worker's port used for establishing an SSH connection.
          type: integer
          format: int32
          example: 22
        ssh_user:
          description: Worker's user used for establishing an SSH connection.
          type: string
          example: root
        ssh_key:
          description: Worker's private key used for establishing an SSH connection.
          type: string
          format: password
        threads:
          description: Number of threads used by a worker both for checking and download.
          type: integer
          format: int32
          example: 16
        storage_path:
          description: Path to the video/metadata storage.
          type: string
          example: /data/videos
        min_free_space_gb:
          description: Required minimum space in GB for the worker.
          type: integer
          format: int32
          example: 100
      example:
        threads: 16
        min_free_space_gb: 100

    WorkerRegister:
      description: Request body sent by a user to register a worker.
      type: object
      required:
        - ssh_host
        - ssh_port
      properties:
        ssh_host:
          description: Host of a PC on which to install a worker.
          type: string
          example: 192.168.1.10
        ssh_port:
          description: SSH port of a PC on which to install a worker.
          type: integer
          format: int32
          example: 22
      example:
        ssh_host: 192.168.1.10
        ssh_port: 22

    WorkerMetrics:
      description: Worker telemetry snapshot.
      type: object
      required:
        - cpu_load
        - memory_load
        - disk_load
        - network_load
        - free_space_bytes
        - n_opened_files
        - n_active_connections
        - worker_uptime
        - identifiers_per_second
        - n_requests
        - n_found_materials
        - n_active_downloads
        - n_bytes_per_second
        - avg_check_speed
        - avg_download_speed
        - download_queue_size
        - n_repeated_attempts
        - n_final_errors
        - oldest_in_queue
      properties:
        cpu_load:
          description: CPU load in percent.
          type: number
          format: double
          example: 45.2
        memory_load:
          description: RAM and SWAP load in percent.
          type: number
          format: double
          example: 60.5
        disk_load:
          description: Disk IO load in percent.
          type: number
          format: double
          example: 30.0
        network_load:
          description: Network load in percent.
          type: number
          format: double
          example: 20.5
        free_space_bytes:
          description: Free space left in bytes.
          type: integer
          format: int64
          example: 1073741824
        n_opened_files:
          description: Number of currently opened files.
          type: integer
          format: int64
          example: 100
        n_active_connections:
          description: Number of currently active connections.
          type: integer
          format: int64
          example: 10
        worker_uptime:
          description: Uptime of the worker in seconds.
          type: integer
          format: int64
          example: 3600
        identifiers_per_second:
          description: Number of identifiers being processed per second.
          type: number
          format: double
          example: 5.5
        n_requests:
          description: Number of requests sent.
          type: integer
          format: int64
          example: 1000
        n_found_materials:
          description: Number of found materials.
          type: integer
          format: int64
          example: 800
        n_active_downloads:
          description: Number of active downloads.
          type: integer
          format: int64
          example: 5
        n_bytes_per_second:
          description: Number of bytes being downloaded per second.
          type: number
          format: double
          example: 1048576
        avg_check_speed:
          description: Average speed of checking an identifier (seconds).
          type: number
          format: double
          example: 0.5
        avg_download_speed:
          description: Average download speed (MB/s).
          type: number
          format: double
          example: 2.5
        download_queue_size:
          description: Size of the download queue.
          type: integer
          format: int64
          example: 100
        n_repeated_attempts:
          description: Number of repeated attempts after rate limiting.
          type: integer
          format: int64
          example: 10
        n_final_errors:
          description: Number of final errors.
          type: integer
          format: int64
          example: 2
        oldest_in_queue:
          description: Age (seconds) of the oldest task in the download queue.
          type: integer
          format: int64
          example: 120
      example:
        cpu_load: 45.2
        memory_load: 60.5
        disk_load: 30.0
        network_load: 20.5
        free_space_bytes: 1073741824
        n_opened_files: 100
        n_active_connections: 10
        worker_uptime: 3600
        identifiers_per_second: 5.5
        n_requests: 1000
        n_found_materials: 800
        n_active_downloads: 5
        n_bytes_per_second: 1048576
        avg_check_speed: 0.5
        avg_download_speed: 2.5
        download_queue_size: 100
        n_repeated_attempts: 10
        n_final_errors: 2
        oldest_in_queue: 120

    # --- USER SCHEMAS ---
    UserId:
      description: The unique identifier of a user.
      type: integer
      format: int64
      example: 1

    UserRole:
      description: Role assigned to a user.
      type: string
      enum:
        - viewer
        - operator
        - administrator
      example: viewer

    User:
      description: General user info.
      type: object
      required:
        - id
        - username
        - role
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        username:
          description: Unique login name of the user.
          type: string
          example: johndoe
        email:
          description: Email address of the user.
          type: string
          format: email
          example: johndoe@example.com
        avatar:
          description: Avatar of the user, base64-encoded.
          type: string
          format: byte
        role:
          $ref: '#/components/schemas/UserRole'
        created_at:
          description: Unix timestamp (seconds) of user creation.
          type: integer
          format: int64
          example: 1700000000
        updated_at:
          description: Unix timestamp (seconds) of the last user update.
          type: integer
          format: int64
          example: 1700000100
      example:
        id: 1
        username: johndoe
        email: johndoe@example.com
        role: viewer
        created_at: 1700000000
        updated_at: 1700000000

    UserRegister:
      description: Registration form fields.
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          description: Desired login name.
          type: string
          minLength: 3
          maxLength: 64
          example: johndoe
        email:
          description: Email address.
          type: string
          format: email
          example: johndoe@example.com
        password:
          description: Account password.
          type: string
          format: password
          minLength: 8
          maxLength: 64
          example: hunter2hunter2
      example:
        username: johndoe
        email: johndoe@example.com
        password: hunter2hunter2

    UserLogin:
      description: Login form fields.
      type: object
      required:
        - email
        - password
      properties:
        email:
          description: Registered email address.
          type: string
          format: email
          example: johndoe@example.com
        password:
          description: Account password.
          type: string
          format: password
          example: hunter2hunter2
      example:
        email: johndoe@example.com
        password: hunter2hunter2

    TokenPair:
      description: Access and refresh token pair issued after login/refresh.
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
      properties:
        access_token:
          description: Short-lived JWT access token.
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.abc
        refresh_token:
          description: Long-lived JWT refresh token.
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwidHlwIjoicmVmcmVzaCJ9.def
        token_type:
          description: Token type, always "Bearer".
          type: string
          const: "Bearer"
      example:
        access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.abc
        refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwidHlwIjoicmVmcmVzaCJ9.def
        token_type: Bearer

    RefreshTokenRequest:
      description: Refresh request payload.
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          description: The refresh token previously issued to the client.
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwidHlwIjoicmVmcmVzaCJ9.def
      example:
        refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwidHlwIjoicmVmcmVzaCJ9.def

    UserUpdate:
      description: Fields to update on a user. The password and role are changed via their own endpoints.
      type: object
      properties:
        username:
          description: New login name.
          type: string
          minLength: 3
          maxLength: 64
          example: john_doe
        email:
          description: New email address.
          type: string
          format: email
          example: john_doe@example.com
        avatar:
          description: New avatar, base64-encoded.
          type: string
          format: byte
      example:
        username: john_doe

    # --- WEB SERVICE SCHEMAS ---
    VideoId:
      description: The unique identifier of a video.
      type: integer
      format: int64
      example: 42

    Video:
      description: Downloaded video belonging to a job.
      type: object
      required:
        - id
        - job_id
        - metadata
        - storage_metadata
      properties:
        id:
          $ref: '#/components/schemas/VideoId'
        job_id:
          $ref: '#/components/schemas/JobId'
        metadata:
          $ref: '#/components/schemas/VideoMetadata'
        storage_metadata:
          $ref: '#/components/schemas/VideoStorageMetadata'
      example:
        id: 42
        job_id: 100
        metadata:
          title: Python tutorial part 1
          source_url: https://kinescope.io/42
          download_url: https://kinescope.io/42.mp4
          found_at: 1700000000
          downloaded_at: 1700000060
          file_size: 104857600
          mime_type: video/mp4
          status: ready
        storage_metadata:
          bucket_name: videos
          object_key: "42"
          checksum: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
          server_name: s3
          local_path: /data/videos/42.mp4

    VideoMetadata:
      description: Metadata of a downloaded video.
      type: object
      required:
        - title
        - source_url
        - download_url
        - found_at
        - downloaded_at
        - file_size
        - mime_type
        - status
      properties:
        title:
          description: Video title.
          type: string
          example: Python tutorial part 1
        source_url:
          description: URL of the video page the video was found on.
          type: string
          format: uri
          example: https://kinescope.io/42
        download_url:
          description: URL the video file was downloaded from.
          type: string
          format: uri
          example: https://kinescope.io/42.mp4
        found_at:
          description: Unix timestamp (seconds) of when the video was found.
          type: integer
          format: int64
          example: 1700000000
        downloaded_at:
          description: Unix timestamp (seconds) of when the video finished downloading.
          type: integer
          format: int64
          example: 1700000060
        file_size:
          description: Size of the video file in bytes.
          type: integer
          format: int64
          example: 104857600
        mime_type:
          description: MIME type of the video file.
          type: string
          example: video/mp4
        status:
          description: Status of the download.
          type: string
          example: ready

    VideoStorageMetadata:
      description: Information used for accessing the video in storage.
      type: object
      required:
        - checksum
      properties:
        bucket_name:
          description: S3 bucket the video is stored in.
          type: string
          example: videos
        object_key:
          description: S3 object key of the video.
          type: string
          example: "42"
        checksum:
          description: SHA-256 checksum of the video file.
          type: string
          example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        server_name:
          description: Storage server the video is stored on.
          type: string
          example: s3
        local_path:
          description: Local path of the video on the worker that downloaded it.
          type: string
          example: /data/videos/42.mp4

    VideoList:
      description: List of videos.
      type: object
      required:
        - items
        - quantity
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Video'
        quantity:
          description: Number of videos in the list.
          type: integer
          format: int64
          example: 1
      example:
        items:
          - $ref: '#/components/schemas/Video'
        quantity: 1

    VideoScore:
      description: Score a video.
      type: object
      required:
        - score
      properties:
        score:
          description: User's score for the video.
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          example: 9
      example:
        score: 9

    Comment:
      description: A comment left on a video.
      type: object
      required:
        - id
        - video_id
        - user_id
        - text
      properties:
        id:
          description: Comment identifier.
          type: integer
          format: int64
          example: 1
        video_id:
          $ref: '#/components/schemas/VideoId'
        user_id:
          $ref: '#/components/schemas/UserId'
        text:
          description: Comment text.
          type: string
          example: Great video!
        created_at:
          description: Unix timestamp (seconds) of comment creation.
          type: integer
          format: int64
          example: 1700000000
        updated_at:
          description: Unix timestamp (seconds) of last comment update.
          type: integer
          format: int64
          example: 1700000000
      example:
        id: 1
        video_id: 42
        user_id: 1
        text: Great video!
        created_at: 1700000000
        updated_at: 1700000000

    CommentList:
      description: Paginated list of comments.
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        total:
          description: Total number of comments.
          type: integer
          format: int64
          example: 1
        limit:
          description: Maximum number of items returned.
          type: integer
          format: int32
          example: 50
        offset:
          description: Number of items skipped.
          type: integer
          format: int32
          example: 0
      example:
        items:
          - id: 1
            video_id: 42
            user_id: 1
            text: Great video!
            created_at: 1700000000
            updated_at: 1700000000
        total: 1
        limit: 50
        offset: 0

    CommentCreate:
      description: Body to create a new comment.
      type: object
      required:
        - video_id
        - text
      properties:
        video_id:
          $ref: '#/components/schemas/VideoId'
        text:
          description: Comment text.
          type: string
          minLength: 1
          maxLength: 2000
          example: Nice explanation!
      example:
        video_id: 42
        text: Nice explanation!

    CommentUpdate:
      description: Body to update an existing comment.
      type: object
      required:
        - comment_id
        - text
      properties:
        comment_id:
          description: Comment identifier.
          type: integer
          format: int64
          example: 1
        text:
          description: New comment text.
          type: string
          minLength: 1
          maxLength: 2000
          example: Even better explanation!
      example:
        comment_id: 1
        text: Even better explanation!

    # --- OTHER SCHEMAS ---
    Error:
      description: Definition for the general error class.
      type: object
      required:
        - errors
        - status
      properties:
        errors:
          description: Human readable error messages.
          type: array
          items:
            type: string
          example:
            - Internal server error
        status:
          description: Status of the failed request, always "fail".
          type: string
          const: "fail"
      example:
        errors:
          - Internal server error
        status: fail

    SubscribeFilter:
      description: Filter used to subscribe to certain identifiers.
      type: array
      items:
        oneOf:
          - type: integer
            description: A single ID.
            format: int64
          - type: string
            pattern: '^\d+-\d+$'
            description: A range of IDs.
      example: ["100-101", 200, 103]

  securitySchemes:
    # JWT token
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Pass your client/user JWT here.

    # The HTTP Signature headers from RFC 9421
    HttpMessageSignature:
      type: apiKey
      in: header
      name: Signature
      description: >
        Requires RFC 9421 HTTP message signatures. 
        Must be together with 'Signature-Input' and 'Signature-Key' headers.
