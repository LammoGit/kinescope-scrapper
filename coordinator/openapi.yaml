                  worker_uptime: 5000
                  identifiers_per_second: 0.0
                  n_requests: 0
                  n_found_materials: 0
                  n_active_downloads: 0
                  n_bytes_per_second: 0.0
                  avg_check_speed: 0.0
                  avg_download_speed: 0.0
                  download_queue_size: 0
                  n_repeated_attempts: 0
                  n_final_errors: 0
                  oldest_in_queue: 0
      responses:
        '200':
          description: >
            Worker is successfully marked as complete.
            Metrics are successfully received and updated if sent.
        '404':
          description: No worker found for the provided `workerId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Worker not found
                  value:
                    error: Worker 1 not found
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error

