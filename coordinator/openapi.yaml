  # SSH Tunneling
  /api/ssh/{workerId}:
    get:
      operationId: SSHTunneling
      summary: Establish a WebSocket connection
      description: This endpoint upgrades the HTTP connection to a WebSocket stream for interactive SSH access.
      tags:
        - websocket
        - user_role_administrator
      security:
        - BearerAuth: []
      parameters:
        - name: workerId
          in: path
          required: true
          description: The unique identifier of the worker.
          schema:
            $ref: '#/components/schemas/WorkerId'
        - name: Upgrade
          in: header
          required: true
          schema:
            type: string
            const: "websocket"
          example: websocket
        - name: Connection
          in: header
          required: true
          schema:
            type: string
            const: "Upgrade"
          example: Upgrade
      responses:
        '101':
          description: Switching Protocols to WebSocket.

  # SSE Streaming
  /api/stream/jobs/metrics:
    get:
      operationId: SSEJobsMetrics
      summary: An SSE stream of jobs' metrics
      tags:
        - sse
      security: []
      parameters:
        - name: X-SSE-Subscribe-Jobs
          in: header
          required: false
          style: simple
          description: Comma-separated list consisting of job IDs and their ranges for which to listen.
          explode: false
          schema:
            $ref: "#/components/schemas/SubscribeFilter"
          example: "100-101,200,103"
      responses:
        '200':
          description: Job metrics stream via SSE.
          content:
            text/event-stream:
              itemSchema:
                oneOf:
                  - description: A telemetry report for a job with a corresponding id.
                    type: object
                    properties:
                      id:
                        description: Job's id.
                        type: integer
                        format: int64
                      event:
                        type: string
                        const: "metrics update"
                      data:
                        $ref: '#/components/schemas/JobMetrics'
                  - description: Just a comment used as a keep-alive message.
                    type: string
                    const: ":"
              examples:
                metricsUpdate:
                  summary: A metrics update event
                  value:
                    id: 100
                    event: metrics update
                    data:
                      cpu_load: 45.2
                      memory_load: 60.5
                      disk_load: 30.0
                      network_load: 20.5
                      free_space_bytes: 1073741824
                      n_opened_files: 100
                      n_active_connections: 10
                      worker_uptime: 3600
                      identifiers_per_second: 5.5
                      n_requests: 1000
                      n_found_materials: 800
                      n_active_downloads: 5
                      n_bytes_per_second: 1048576
                      avg_check_speed: 0.5
                      avg_download_speed: 2.5
                      download_queue_size: 100
                      n_repeated_attempts: 10
                      n_final_errors: 2
                      oldest_in_queue: 120
                keepAlive:
                  summary: Keep-alive comment
                  value: ":"
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error

