                    type: string
                    const: ":"
              examples:
                metricsUpdate:
                  summary: A metrics update event
                  value:
                    event: job.metrics
                    data:
                      range_id: 1
                      job_id: 100
                      worker_id: 1
                      cpu_load: 45.2
                      memory_load: 60.5
                      disk_load: 30.0
                      network_load: 20.5
                      free_space_bytes: 1073741824
                      opened_files: 100
