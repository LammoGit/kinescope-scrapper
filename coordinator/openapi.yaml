                  - link
                properties:
                  link:
                    description: Presigned S3 PUT link, valid for one hour.
                    type: string
                    format: uri
                    example: "https://scrappy.ai/s3/videos/42?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Expires=3600&X-Amz-Signature=abc"
              examples:
                uploadLink:
                  summary: Presigned upload link for resource 42
                  value:
                    link: "https://scrappy.ai/s3/videos/42?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Expires=3600&X-Amz-Signature=abc"
