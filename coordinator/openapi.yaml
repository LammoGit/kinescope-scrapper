        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  summary: Internal error
                  value:
                    error: Internal server error

  /api/service/video/comments:
    get:
      operationId: GetComments
      summary: Get comments for a video
      tags:
        - service
